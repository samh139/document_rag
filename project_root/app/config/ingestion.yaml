ingestion:
  chunking:
    pdf:
      max_chars: 2000
      overlap: 200
    docx:
      max_chars: 2000
      overlap: 200
    markdown:
      max_chars: 1500
      overlap: 150
    txt:
      max_chars: 1800
      overlap: 150

  minio:
    enabled: false
    bucket: "documents"
    base_path: "raw/"
    endpoint: "${MINIO_ENDPOINT}"
    access_key: "${MINIO_ACCESS_KEY}"
    secret_key: "${MINIO_SECRET_KEY}"

  elasticsearch:
    index_name: "docsprawl_chunks"
    create_index_if_missing: true

  embeddings:
    batch_size: 32
    model: "nomic-embed-text"
    normalize: true

  kafka:
    enabled: false
    topic: "doc_chunks"
    bootstrap_servers: "${KAFKA_BOOTSTRAP}"
