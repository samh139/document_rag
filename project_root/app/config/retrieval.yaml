retrieval:
  elasticsearch:
    hybrid:
      enabled: true
      weight_bm25: 0.6
      weight_vector: 0.4

    rrf:
      enabled: true
      k: 20
      depth: 60

    reranker:
      enabled: true
      model: "cross-encoder/ms-marco-MiniLM-L-6-v2"   # faster + accurate
      top_k: 30 

  query_classifier:
    model: "gemma3:4b"     # or leave blank if using rule-based

  result_limits:
    max_chunks: 20
    max_characters: 5000
